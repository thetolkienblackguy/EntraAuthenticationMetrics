<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{TITLE}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f0f2f5;font-family:Segoe UI,Arial,Helvetica,sans-serif;color:#1a1a2e;line-height:1.6;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f0f2f5;">
        <tr>
            <td align="center" style="padding:0;">
                <table role="presentation" width="960" cellpadding="0" cellspacing="0" border="0" style="max-width:960px;width:100%;">

                    <!-- Header -->
                    <tr>
                        <td style="background-color:#1e293b;padding:24px 32px;border-radius:0 0 8px 8px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="left" style="vertical-align:top;">
                                        <p style="margin:0 0 6px 0;font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:1.8px;text-transform:uppercase;">&#10022; AuthenticationIQ</p>
                                        <h1 style="margin:0 0 4px 0;font-size:22px;font-weight:600;color:#ffffff;">{{TITLE}}</h1>
                                        <p style="margin:0 0 2px 0;font-size:13px;color:#94a3b8;">Generated: {{TIMESTAMP}}</p>
                                        {{TENANT_HTML}}
                                        <p style="margin:2px 0 0 0;font-size:12px;color:#94a3b8;letter-spacing:0.2px;">Author: Gabriel Delaney</p>
                                    </td>
                                    <td align="right" style="vertical-align:top;font-size:12px;color:#94a3b8;white-space:nowrap;">
                                        <a href="https://www.linkedin.com/in/gabe-delaney-78709115" style="color:#cbd5e1;text-decoration:none;margin-left:12px;" target="_blank">LinkedIn</a>
                                        <span style="color:#475569;">&nbsp;|&nbsp;</span>
                                        <a href="https://github.com/thetolkienblackguy" style="color:#cbd5e1;text-decoration:none;" target="_blank">GitHub</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Spacer -->
                    <tr><td style="height:24px;"></td></tr>

                    {{INTRO_HTML}}

                    <!-- Summary Cards -->
                    <tr>
                        <td>
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    {{SUMMARY_HTML}}
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Spacer -->
                    <tr><td style="height:24px;"></td></tr>

                    {{SECTIONS_HTML}}

                    {{FOOTER_HTML}}

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
